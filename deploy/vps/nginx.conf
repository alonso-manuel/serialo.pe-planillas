# Serialo Planillas (modo SaaS). Plantilla: instalar.sh reemplaza {DOMINIO}, {DIR} y {PHP}.
# Atiende *.{DOMINIO}: cada estudio (garcia.{DOMINIO}) y el panel (admin.{DOMINIO}).
# El dominio raíz ({DOMINIO}) NO pasa por aquí: puede seguir siendo la web de Serialo.pe en otro hosting.

server {
    listen 80;
    listen [::]:80;
    server_name *.{DOMINIO};
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name *.{DOMINIO};

    root {DIR}/public;
    index index.php;
    charset utf-8;
    client_max_body_size 20M;   # cargas masivas (Excel) y logos

    ssl_certificate     /etc/letsencrypt/live/{DOMINIO}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/{DOMINIO}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Assets compilados: caché larga (llevan hash en el nombre).
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php{PHP}-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 120;
        fastcgi_hide_header X-Powered-By;
    }

    # Ningún otro .php ni archivo oculto (.env, .git) se sirve.
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known) { deny all; }
}
