; Serialo Planillas (contenedor «app»)
memory_limit = 512M
upload_max_filesize = 20M
post_max_size = 25M
max_execution_time = 120
expose_php = Off
date.timezone = America/Lima

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
; El código no cambia dentro del contenedor (se reemplaza la imagen): no hace falta revisar archivos.
opcache.validate_timestamps = 0
