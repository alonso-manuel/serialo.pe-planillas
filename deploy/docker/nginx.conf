# Nginx interno del contenedor «web». Recibe del proxy del servidor (que atiende HTTPS y *.impulso.cfd)
# y pasa PHP al contenedor «app». El nombre del estudio sale del Host, que el proxy debe conservar.
server {
    listen 80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;
    charset utf-8;
    client_max_body_size 20M;   # cargas masivas (Excel), logos y certificados

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Assets compilados: caché larga (llevan hash en el nombre).
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass app:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_read_timeout 120;
        fastcgi_hide_header X-Powered-By;
    }

    # Ningún otro .php ni archivo oculto (.env, .git) se sirve.
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known) { deny all; }
}
